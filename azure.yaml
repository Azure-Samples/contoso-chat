name: contoso-chat-openai-prompty
metadata:
  template: contoso-chat-openai-prompty@0.0.2
services:
  aca:
    project: ./src/api
    language: python
    host: containerapp
    docker:
      remoteBuild: true
hooks:
  postprovision:
    posix:
      shell: sh
      continueOnError: true
      interactive: true
      run: infra/hooks/postprovision.sh
    windows:
      shell: pwsh
      continueOnError: true
      interactive: true
      run: infra/hooks/postprovision.ps1
  postdeploy:
    posix:
      shell: sh
      continueOnError: true
      interactive: true
      run: infra/hooks/postdeploy.sh
    windows:
      shell: pwsh
      continueOnError: true
      interactive: true
      run: infra/hooks/postdeploy.ps1
infra:
    provider: "bicep"

requiredVersions:
  azd: ">= 1.17.0"
